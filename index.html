<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Minato Mirai Days</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;700;900&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
:root{
  --paper:#f1f4f5;
  --panel:#ffffff;
  --ink:#132338;
  --ink2:#3a4a5e;
  --muted:#627184;
  --rule:#ccd6dd;
  --harbor:#0b6fa4;
  --harbor-ink:#ffffff;
  --brick:#a3432b;
  --water:#d3e2ea;
  --land:#f8f9f7;
  --shore:#8aa3b3;
  --chipbg:#e4ecf0;
  --warn:#b3261e;
  --ok:#2f7d4f;
  --cash:#8a6a00;
  --display:"Zen Kaku Gothic New","Hiragino Kaku Gothic ProN","Noto Sans JP","Helvetica Neue",Arial,sans-serif;
  --body:"Source Serif 4","Iowan Old Style",Georgia,serif;
  --mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --paper:#0e1622;--panel:#152131;--ink:#e6edf3;--ink2:#bdc9d5;--muted:#8a99aa;
    --rule:#2a3a4d;--harbor:#5cb3e0;--harbor-ink:#0e1622;--brick:#e0795c;
    --water:#10263a;--land:#1a2636;--shore:#4a6378;--chipbg:#1e2e42;
    --warn:#ff8a80;--ok:#7fd1a0;--cash:#e7c65a;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --paper:#0e1622;--panel:#152131;--ink:#e6edf3;--ink2:#bdc9d5;--muted:#8a99aa;
  --rule:#2a3a4d;--harbor:#5cb3e0;--harbor-ink:#0e1622;--brick:#e0795c;
  --water:#10263a;--land:#1a2636;--shore:#4a6378;--chipbg:#1e2e42;
  --warn:#ff8a80;--ok:#7fd1a0;--cash:#e7c65a;
}
*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.58;-webkit-font-smoothing:antialiased}
a{color:inherit}
button{font:inherit;color:inherit}

/* ---------- top bar ---------- */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--ink);color:var(--paper)}
.brand{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 14px;padding:10px 16px 8px;max-width:1080px;margin:0 auto}
.brand b{font-family:var(--display);font-weight:900;font-size:16px;letter-spacing:.04em}
.brand span{font-family:var(--mono);font-size:11.5px;letter-spacing:.04em;opacity:.72}
nav{display:flex;overflow-x:auto;scrollbar-width:none;max-width:1080px;margin:0 auto;padding:0 8px}
nav::-webkit-scrollbar{display:none}
nav button{flex:0 0 auto;background:none;border:0;cursor:pointer;color:inherit;opacity:.68;
  font-family:var(--display);font-weight:700;font-size:13px;letter-spacing:.06em;padding:10px 12px 9px;border-bottom:3px solid transparent}
nav button:hover{opacity:1}
nav button[aria-current="true"]{opacity:1;border-bottom-color:var(--harbor)}
nav button:focus-visible{outline:2px solid var(--harbor);outline-offset:-2px}

main{max-width:1080px;margin:0 auto;padding:0 16px 80px}
.card{padding-top:26px}

/* ---------- station-sign header ---------- */
.sign{background:var(--panel);border:1px solid var(--rule);border-radius:4px;overflow:hidden;margin-bottom:22px}
.sign-main{padding:18px 20px 14px;display:grid;gap:2px}
.sign-main .jp{font-family:var(--display);font-weight:700;font-size:15px;color:var(--muted);letter-spacing:.12em}
.sign-main h1{margin:0;font-family:var(--display);font-weight:900;font-size:clamp(34px,6vw,54px);line-height:1.05;letter-spacing:-.01em;text-wrap:balance}
.sign-main .code{font-family:var(--mono);font-size:12px;color:var(--muted);letter-spacing:.04em}
.sign-bar{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;background:var(--harbor);color:var(--harbor-ink)}
.sign-bar button{background:none;border:0;cursor:pointer;color:inherit;font-family:var(--display);font-weight:700;font-size:14px;padding:9px 14px;letter-spacing:.03em}
.sign-bar button:hover{text-decoration:underline}
.sign-bar button:focus-visible{outline:2px solid var(--harbor-ink);outline-offset:-3px}
.sign-bar .prev{text-align:left}
.sign-bar .next{text-align:right}
.sign-bar .here{width:14px;height:14px;border-radius:50%;background:var(--harbor-ink);border:3px solid var(--harbor);box-shadow:0 0 0 2px var(--harbor-ink)}
.lede{font-size:19px;line-height:1.5;color:var(--ink2);max-width:62ch;margin:0 0 20px}

h2{font-family:var(--display);font-weight:900;font-size:15px;letter-spacing:.1em;text-transform:uppercase;margin:38px 0 12px;padding-bottom:7px;border-bottom:2px solid var(--ink);text-wrap:balance}
h3{font-family:var(--display);font-weight:700;font-size:17px;margin:0 0 4px}
p{margin:0 0 12px;max-width:68ch}

.facts{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
.fact{background:var(--panel);border:1px solid var(--rule);border-radius:4px;padding:13px 15px}
.fact .k{display:block;font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.fact .v{display:block;font-family:var(--display);font-weight:900;font-size:21px;line-height:1.2;margin:3px 0 4px}
.fact .n{display:block;font-size:14.5px;color:var(--ink2);line-height:1.45}
.note{background:var(--panel);border:1px solid var(--rule);border-left:4px solid var(--brick);border-radius:4px;padding:14px 16px;margin:16px 0;max-width:820px}
.note p:last-child{margin-bottom:0}

/* ---------- lists ---------- */
.chips{display:flex;flex-wrap:wrap;gap:7px;margin:4px 0 8px}
.chip{border:1.5px solid var(--rule);background:var(--panel);border-radius:3px;cursor:pointer;
  font-family:var(--display);font-weight:700;font-size:12.5px;letter-spacing:.04em;padding:5px 11px}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.chip:focus-visible{outline:2px solid var(--harbor);outline-offset:2px}
.count{font-family:var(--mono);font-size:11.5px;color:var(--muted);margin:0 0 12px}
.items{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(310px,1fr))}
.item{background:var(--panel);border:1px solid var(--rule);border-radius:4px;padding:14px 16px;display:flex;flex-direction:column;gap:6px}
.item .nm{font-family:var(--display);font-weight:900;font-size:18px;line-height:1.25}
.item .nm small{font-weight:700;font-size:13px;color:var(--muted);margin-left:6px;letter-spacing:.04em}
.item .meta{font-family:var(--mono);font-size:11.5px;color:var(--muted);line-height:1.5}
.item .meta b{color:var(--ink);font-weight:500}
.item .d{font-size:15.5px;line-height:1.5;margin:0}
.item .tip{font-size:14.5px;color:var(--ink2);border-top:1px dotted var(--rule);padding-top:7px;margin:0}
.item .tip b{font-family:var(--mono);font-size:10.5px;font-weight:500;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-right:4px}
.flags{display:flex;flex-wrap:wrap;gap:5px}
.flag{font-family:var(--display);font-weight:700;font-size:11px;letter-spacing:.04em;padding:2px 7px;border-radius:2px;border:1.5px solid currentColor}
.flag.warn{color:var(--warn)}
.flag.ok{color:var(--ok)}
.flag.cash{color:var(--cash)}
.flag.info{color:var(--harbor)}
.item .links{margin-top:auto;padding-top:4px;display:flex;flex-wrap:wrap;gap:12px;font-family:var(--display);font-weight:700;font-size:13px}
.item .links a{text-decoration:none;border-bottom:2px solid var(--harbor)}
.item .links a:hover{color:var(--harbor)}

/* ---------- tables ---------- */
.tablewrap{overflow-x:auto;margin:12px 0}
table{border-collapse:collapse;width:100%;min-width:520px;background:var(--panel);font-size:15.5px}
th,td{text-align:left;vertical-align:top;padding:9px 12px;border-bottom:1px solid var(--rule)}
th{font-family:var(--mono);font-weight:500;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
td:first-child{font-family:var(--display);font-weight:700;white-space:nowrap}
td .jp{display:block;font-weight:400;font-size:12.5px;color:var(--muted)}

/* ---------- week board ---------- */
.board{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(160px,1fr))}
.day{background:var(--panel);border:1px solid var(--rule);border-radius:4px;overflow:hidden}
.day header{background:var(--ink);color:var(--paper);padding:8px 12px;display:flex;justify-content:space-between;align-items:baseline}
.day header b{font-family:var(--display);font-weight:900;font-size:18px}
.day header span{font-family:var(--mono);font-size:11px;opacity:.75}
.day ul{list-style:none;margin:0;padding:6px 12px 10px}
.day li{padding:6px 0;border-bottom:1px dotted var(--rule);font-size:14px;line-height:1.4}
.day li:last-child{border-bottom:0}
.day li .t{display:block;font-family:var(--mono);font-size:11px;color:var(--muted)}

/* ---------- plan ---------- */
.plan{display:grid;gap:12px}
.plan .dayplan{background:var(--panel);border:1px solid var(--rule);border-radius:4px;padding:14px 16px;display:grid;grid-template-columns:120px 1fr;gap:4px 18px}
.plan .when{font-family:var(--display)}
.plan .when b{display:block;font-weight:900;font-size:22px;line-height:1.1}
.plan .when span{font-family:var(--mono);font-size:11.5px;color:var(--muted)}
.plan dl{margin:0;display:grid;grid-template-columns:62px 1fr;gap:5px 10px;font-size:15.5px}
.plan dt{font-family:var(--mono);font-size:12px;color:var(--muted);padding-top:3px;font-variant-numeric:tabular-nums}
.plan dd{margin:0}
@media (max-width:560px){.plan .dayplan{grid-template-columns:1fr}}

/* ---------- map ---------- */
.mapwrap{background:var(--panel);border:1px solid var(--rule);border-radius:4px;padding:12px}
.legend{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.lg{display:flex;align-items:center;gap:7px;border:1.5px solid var(--rule);background:none;border-radius:3px;cursor:pointer;padding:4px 10px;font-family:var(--display);font-weight:700;font-size:12.5px}
.lg i{width:11px;height:11px;border-radius:50%;background:var(--k);display:block}
.lg i.sq{border-radius:1px}
.lg[aria-pressed="false"]{opacity:.4}
.lg:focus-visible{outline:2px solid var(--harbor);outline-offset:2px}
#svgmap{display:block;width:100%;height:auto;max-width:100%}
#svgmap text{font-family:var(--display);pointer-events:none}
.mk{cursor:pointer}
.mk:focus{outline:none}
.mk:focus circle,.mk:hover circle,.mk:focus rect,.mk:hover rect{stroke:var(--ink);stroke-width:2.5}
#mapinfo{border-top:2px solid var(--ink);margin-top:10px;padding-top:10px;min-height:70px;font-size:15.5px}
#mapinfo .nm{font-family:var(--display);font-weight:900;font-size:18px}
#mapinfo .meta{font-family:var(--mono);font-size:11.5px;color:var(--muted);margin:2px 0 6px}
#mapinfo a{font-family:var(--display);font-weight:700;font-size:13px;text-decoration:none;border-bottom:2px solid var(--harbor)}

.jump{background:none;border:0;padding:0;cursor:pointer;font-family:var(--display);font-weight:700;border-bottom:2px solid var(--harbor);font-size:.95em}
.jump:focus-visible{outline:2px solid var(--harbor);outline-offset:2px}
footer{max-width:1080px;margin:0 auto;padding:18px 16px 30px;border-top:1px solid var(--rule);font-family:var(--mono);font-size:11.5px;color:var(--muted)}
@media (prefers-reduced-motion:no-preference){.card{animation:rise .2s ease-out}}
@keyframes rise{from{transform:translateY(4px)}to{transform:none}}
@media (max-width:520px){body{font-size:16px}.lede{font-size:17.5px}.items{grid-template-columns:1fr}}
</style>
</head>

  <div class="brand"><b>Minato Mirai Days</b><span>Yokohama · Pacifico Yokohama North · Sun 27 Sep – Fri 2 Oct 2026</span></div>

<main id="main"></main>
<footer>Compiled 26 Sep 2026. Opening days, exhibition runs and event times change; check anything you plan a day around. Map shoreline is approximate.</footer>

<script>
const CARDS=[

 {id:'practical',nav:'Practical',jp:'実用情報',code:'Transit, money, weather'}
];

/* ---------------- places ---------------- */
const P=[

 o:'ICSCRM 2026, Sun 27 Sep – Fri 2 Oct',
 d:'The 2020 convention wing at the harbor end of Minato Mirai, joined to the older Pacifico halls and the sail-shaped InterContinental. Six minutes on foot from Minatomirai Station (MM03) through Queen’s Square.'},

{s:'see',t:['Museum','Art'],n:'Yokohama Museum of Art',jp:'横浜美術館',h:'Minato Mirai',lat:35.4573,lng:139.6305,

{s:'see',t:['Museum','Hands-on'],n:'Cup Noodles Museum',jp:'カップヌードルミュージアム',h:'Shinko',lat:35.4556,lng:139.6391,

{s:'see',t:['View','Ticketed'],n:'Cosmo Clock 21 Ferris wheel',jp:'コスモクロック21',h:'Minato Mirai',lat:35.4553,lng:139.6372,

{s:'see',t:['Ride','Ticketed'],n:'Yokohama Air Cabin',jp:'ヨコハマエアキャビン',h:'Sakuragicho',lat:35.4515,lng:139.6322,

{s:'see',t:['Walk','Free'],n:'Kishamichi Promenade',jp:'汽車道',h:'Minato Mirai',lat:35.4528,lng:139.6360,

{s:'see',t:['History','Shopping'],n:'Red Brick Warehouse',jp:'横浜赤レンガ倉庫',h:'Shinko',lat:35.4527,lng:139.6425,
 o:'Shops roughly 11:00–20:00; plaza always open',d:'Two customs warehouses from 1911 and 1913, converted into shops and restaurants. The plaza between them hosts a festival most weeks of the year.',
 tip:'All week the plaza holds Yokohama Oktoberfest. See <span class="jumpref" data-go="week">This Week</span>.'},
{s:'see',t:['Waterfront','Food'],n:'Yokohama Hammerhead',jp:'ハンマーヘッド',h:'Shinko',lat:35.4568,lng:139.6424,
 o:'Shops roughly 11:00–20:00',d:'A cruise terminal named for the 1914 hammerhead crane still standing on the quay. The ground floor is a food hall with craft beer and ramen counters.'},

 tip:'The best night view in the city costs nothing. Walk out after dinner in Chinatown.'},
{s:'see',t:['Park','Free'],n:'Yamashita Park',jp:'山下公園',h:'Yamashita',lat:35.4458,lng:139.6500,
 o:'Always open',d:'A seafront park built on rubble from the 1923 Great Kanto Earthquake. Benches, rose beds and harbor ships all along the promenade.',f:['info|Free']},
{s:'see',t:['Museum','History'],n:'Hikawa Maru',jp:'氷川丸',h:'Yamashita',lat:35.4455,lng:139.6512,
 o:'Typically 10:00–17:00, closed Mondays',d:'A 1930 ocean liner that carried Charlie Chaplin across the Pacific and served as a hospital ship in the war. The Art Deco dining saloon survives intact.'},
{s:'see',t:['View','Ticketed'],n:'Yokohama Marine Tower',jp:'マリンタワー',h:'Yamashita',lat:35.4439,lng:139.6507,

{s:'see',t:['Walk','Free'],n:'Yamate Bluff & Harbor View Park',jp:'港の見える丘公園',h:'Yamate',lat:35.4385,lng:139.6535,

{s:'see',t:['History','Free'],n:'Foreign General Cemetery',jp:'外国人墓地',h:'Yamate',lat:35.4392,lng:139.6512,
 o:'Grounds open some weekends; viewing from the fence daily',d:'About 4,400 graves of sailors, traders and missionaries from 40 countries, laid out on the bluff since 1854.'},
{s:'see',t:['Museum','Free'],n:'Nissan Global HQ Gallery',jp:'日産グローバル本社ギャラリー',h:'Yokohama Station',lat:35.4618,lng:139.6272,
 o:'Typically 10:00–20:00',d:'Free showroom of current and historic cars, with a rotating heritage display. Next door to Shin-Takashima Station (MM02).',f:['info|Free']},
{s:'see',t:['Museum','Hands-on'],n:'Hara Model Railway Museum',jp:'原鉄道模型博物館',h:'Yokohama Station',lat:35.4640,lng:139.6258,
 o:'Typically 10:00–17:00, closed Tuesdays',d:'One man’s collection of more than 1,000 hand-built model trains, with one of the largest indoor layouts in the world running on real-scale track.',f:['warn|Closed Tue']},
{s:'see',t:['Garden','Ticketed'],n:'Sankeien Garden',jp:'三溪園',h:'Honmoku (off map)',lat:35.4167,lng:139.6617,off:true,
 o:'Typically 09:00–17:00',d:'A silk merchant’s 175,000 m² garden with 17 historic buildings moved here from Kyoto and Kamakura, including a 500-year-old pagoda. Bus 8 or 148 from Sakuragicho, about 35 minutes.',

/* ---- eat & drink ---- */

 o:'Lunch and dinner daily',d:'Cantonese since 1892, in a red and gold building on the main street. Order the roast meats platter and the shark-fin soup if you are feeling flush.',f:['warn|Reserve dinner'],

const BODY={
overview:()=>`
<p class="lede">Six days based at Pacifico Yokohama North for ICSCRM 2026, with the harbor, Chinatown and the old port district all inside a 25-minute walk. This guide covers what you can reach before sessions, between them and after them.</p>
<div class="facts">
 <div class="fact"><span class="k">Dates</span><span class="v">Sun 27 Sep – Fri 2 Oct</span><span class="n">Matches the ICSCRM schedule exactly. Sessions run on weekdays; the conference closes mid-afternoon Friday.</span></div>
 <div class="fact"><span class="k">Nearest station</span><span class="v">Minatomirai · MM03</span><span class="n">6 minutes on foot through Queen’s Square. Yokohama Station is 3 minutes away by train.</span></div>
 <div class="fact"><span class="k">Weather, typically</span><span class="v">25°C / 19°C</span><span class="n">Late-September highs and lows. Autumn rain is common and typhoon season is not over; carry a small umbrella.</span></div>
 <div class="fact"><span class="k">Daylight</span><span class="v">05:35 – 17:30</span><span class="n">Sunset is around 17:30, so most evenings after sessions start in the dark. Plan views for night.</span></div>
</div>
<h2>How the harbor fits together</h2>
<p>Yokohama was a fishing village until 1859, when it became one of the first ports opened to foreign trade. Everything in this guide follows from that. The foreign settlement became Kannai and the Bluff, the Chinese merchants who came with the traders built Chinatown, and the shipyards later became Minato Mirai.</p>
<p>The layout runs roughly northwest to southeast along the water. Yokohama Station is at the top, Minato Mirai and the venue in the middle, then Shinko island, Kannai, Yamashita Park and Chinatown, with the Bluff on the hill at the far end. The Minatomirai Line runs underneath the whole route, six stations from MM01 to MM06.</p>
<div class="note"><p><b>What makes this week particular.</b> Yokohama Oktoberfest fills the Red Brick Warehouse plaza for all six days, and the BayStars play their last home games of the regular season on Sunday and Monday. Sunday is also busy at Pacifico itself, with a concert and two fan events in the other halls. See <button class="jump" data-go="week">This Week</button>.</p></div>
<h2>Where to start</h2>
<p>For a single free evening, take the Kishamichi walk from the venue to the Red Brick Warehouse, then continue to Osanbashi Pier for the skyline and on to Chinatown for dinner. That covers four of the nine neighborhoods in about 3 km. <button class="jump" data-go="plan">Six Days</button> lays out every evening of the week.</p>`,

eat:()=>`<p class="lede">Yokohama invented a surprising number of Japan’s everyday foods. These places serve them best, plus quick options near the venue and a few bars for after sessions.</p>
<div class="note"><p><b>Reservations.</b> Most restaurants book through TableCheck, Tabelog or Hot Pepper, or by phone. Chinatown’s older banquet houses and the gyunabe restaurant need a booking for dinner; noodle shops, street food and Noge izakaya never take one. Queues are normal and orderly: join the end and wait. Service charges appear at hotels and upscale places; there is no tipping anywhere.</p></div>
<h2>The dishes to know</h2>

<h2>If it rains</h2>
<p>Almost everything near the venue connects indoors: Minatomirai Station, Queen’s Square, MARK IS and the Landmark Tower share underground and covered walkways. Good wet-evening options are the Yokohama Museum of Art (not Thursday), the Hammerhead food hall and Chinatown, where the streets are narrow enough to dash between restaurants.</p>`,

practical:()=>`<p class="lede">Getting in, getting around and the few local conventions that matter.</p>
<h2>Arriving</h2>
<div class="tablewrap"><table><thead><tr><th>From</th><th>How</th></tr></thead><tbody>
<tr><td>Haneda</td><td>Keikyu Line to Yokohama, about 25–30 minutes, then the Minatomirai Line 3 minutes to MM03. Airport limousine buses also run to the Minato Mirai hotels and Yokohama City Air Terminal (YCAT).</td></tr>
<tr><td>Narita</td><td>Narita Express to Yokohama, about 90 minutes, then the Minatomirai Line.</td></tr>
<tr><td>Tokyo</td><td>JR Tokaido or Yokosuka Line to Yokohama, 25–30 minutes. The Tokyu Toyoko Line from Shibuya runs straight through onto the Minatomirai Line.</td></tr>
</tbody></table></div>
<h2>Getting around</h2>
<div class="tablewrap"><table><thead><tr><th>Mode</th><th>How it works</th></tr></thead><tbody>
<tr><td>IC card</td><td>Suica or PASMO, on a phone wallet or as a physical card, works on every train, bus and most konbini. Top up at any station machine.</td></tr>
<tr><td>Minatomirai Line</td><td>Six stations from Yokohama (MM01) to Motomachi-Chukagai (MM06). A one-day pass costs about ¥460 and pays for itself after three rides.</td></tr>
<tr><td>Walking</td><td>The venue to Chinatown is about 3 km along the water. Most evenings in this guide start as a 10–20 minute walk.</td></tr>
<tr><td>Sea Bass</td><td>A water bus linking Yokohama Station, Minato Mirai, the Red Brick Warehouse and Yamashita Park. Slower than the train, better view.</td></tr>
<tr><td>Taxi</td><td>Plentiful at stations and hotels. Doors open automatically. Most accept cards and IC cards.</td></tr>
</tbody></table></div>
<h2>Money and conventions</h2>
<div class="facts">
 <div class="fact"><span class="k">Tipping</span><span class="v">None</span><span class="n">Leaving money on the table causes confusion. Service charges are added at hotels and some upscale restaurants.</span></div>
 <div class="fact"><span class="k">Cash</span><span class="v">Carry ¥10,000+</span><span class="n">Cards are widely accepted, but Noge bars, Chinatown street food and ramen ticket machines often want cash. Convenience-store ATMs take foreign cards.</span></div>
 <div class="fact"><span class="k">Tax-free</span><span class="v">Over ¥5,000</span><span class="n">Show your passport at the register in department stores and larger shops.</span></div>
 <div class="fact"><span class="k">Power</span><span class="v">100 V · Type A</span><span class="n">US two-pin plugs fit. Most laptop chargers handle 100 V without an adapter.</span></div>
</div>
<h2>Small things that help</h2>
<p><b>Trash cans are rare.</b> Carry a bag and dispose of rubbish at your hotel or a konbini.</p>
<p><b>Smoking outdoors is banned</b> on Minato Mirai streets outside marked areas.</p>
<p><b>Weather.</b> Late September is still typhoon season. Check the Japan Meteorological Agency forecast before any outdoor evening; trains and water buses stop in strong wind.</p>
<p><b>Konbini.</b> 7-Eleven, Lawson and FamilyMart sell good breakfasts, coffee and umbrellas, and there is one inside or next to nearly every building near the venue.</p>`

CARDS.forEach((c,i)=>{
 const b=document.createElement('button');b.textContent=c.nav;b.dataset.go=c.id;nav.appendChild(b);
 const s=document.createElement('section');s.className='card';s.dataset.card=c.id;s.hidden=true;
 s.innerHTML=sign(i)+BODY[c.id]();main.appendChild(s);

function filters(sec){
 const wrap=document.querySelector('.chips[data-f="'+sec+'"]'),items=P.filter(p=>p.s===sec);
 const tags=[...new Set(items.flatMap(p=>p.t))];let act=null;
 const draw=()=>{const sh=act?items.filter(p=>p.t.includes(act)):items;
  $('#list-'+sec).innerHTML=sh.map(item).join('');
  $('#count-'+sec).textContent=sh.length+' of '+items.length+' shown'+(act?' · '+act:'');
  wrap.querySelectorAll('.chip').forEach(c=>c.setAttribute('aria-pressed',String((c.dataset.t||null)===act)));};
 ['All',...tags].forEach(t=>{const c=document.createElement('button');c.className='chip';c.textContent=t;
  if(t!=='All')c.dataset.t=t;c.addEventListener('click',()=>{act=(t==='All'||act===t)?null:t;draw();});wrap.appendChild(c);});
 draw();
}
filters('see');filters('eat');

function go(id,pin){
 const c=CARDS.find(x=>x.id===id)||CARDS[0];
 document.querySelectorAll('.card').forEach(s=>s.hidden=s.dataset.card!==c.id);
 nav.querySelectorAll('button').forEach(b=>b.setAttribute('aria-current',String(b.dataset.go===c.id)));
 try{if(location.hash.slice(1)!==c.id)history.replaceState(null,'','#'+c.id)}catch(e){}
 window.scrollTo(0,0);
 if(c.id==='map'){drawMap();if(pin!=null)showPin(+pin);}
}
document.addEventListener('click',e=>{
 const g=e.target.closest('[data-go]');if(g){go(g.dataset.go);return;}
 const p=e.target.closest('[data-pin]');if(p)go('map',p.dataset.pin);
});
window.addEventListener('hashchange',()=>go(location.hash.slice(1)));

/* ---------------- map ---------------- */
const B={lat0:35.436,lat1:35.468,lng0:139.617,lng1:139.656};
const K=Math.cos(35.452*Math.PI/180),W=800,H=Math.round(W*(B.lat1-B.lat0)/((B.lng1-B.lng0)*K));
const X=l=>(l-B.lng0)/(B.lng1-B.lng0)*W, Y=l=>(B.lat1-l)/(B.lat1-B.lat0)*H;
const COAST=[[35.468,139.617],[35.468,139.6262],[35.4662,139.6275],[35.4648,139.6290],[35.4630,139.6318],[35.4625,139.6343],[35.4624,139.6385],[35.4614,139.6410],[35.4590,139.6408],[35.4578,139.6398],[35.4583,139.6420],[35.4585,139.6440],[35.4560,139.6458],[35.4528,139.6450],[35.4508,139.6442],[35.4500,139.6448],[35.4528,139.6492],[35.4518,139.6505],[35.4490,139.6468],[35.4470,139.6482],[35.4448,139.6522],[35.4430,139.6548],[35.4412,139.6560],[35.436,139.656],[35.436,139.617]];
const CAT={venue:{k:'var(--ink)',l:'Venue'},see:{k:'var(--harbor)',l:'See'},eat:{k:'var(--brick)',l:'Eat & drink'},stn:{k:'var(--muted)',l:'Stations',sq:true}};
const LBL=[['MINATO MIRAI',35.4592,139.6372],['SHINKO',35.4548,139.6415],['NOGE',35.4478,139.6268],['KANNAI',35.4455,139.6395],['CHINATOWN',35.4413,139.6455],['YAMATE',35.4378,139.6528],['YOKOHAMA STN',35.4672,139.6205],['YOKOHAMA BAY',35.4640,139.6480]];
let drawn=false;const off=new Set();
function drawMap(){
 if(drawn)return;drawn=true;
 const svg=$('#svgmap'),NS='http://www.w3.org/2000/svg';
 svg.setAttribute('viewBox','0 0 '+W+' '+H);
 const el=(t,a,txt)=>{const e=document.createElementNS(NS,t);for(const k in a)e.setAttribute(k,a[k]);if(txt)e.textContent=txt;return e;};
 svg.appendChild(el('rect',{x:0,y:0,width:W,height:H,fill:'var(--water)'}));
 svg.appendChild(el('path',{d:COAST.map((p,i)=>(i?'L':'M')+X(p[1]).toFixed(1)+' '+Y(p[0]).toFixed(1)).join(' ')+'Z',fill:'var(--land)',stroke:'var(--shore)','stroke-width':1.5,'stroke-linejoin':'round'}));
 /* Minatomirai Line */
 const ml=P.filter(p=>p.s==='stn'&&/^MM/.test(p.code));
 svg.appendChild(el('polyline',{points:ml.map(p=>X(p.lng).toFixed(1)+','+Y(p.lat).toFixed(1)).join(' '),fill:'none',stroke:'var(--muted)','stroke-width':3,'stroke-dasharray':'2 6','stroke-linecap':'round',opacity:.7}));
 const layer=el('g',{});svg.appendChild(layer);
 const labels=el('g',{});
 LBL.forEach(([t,la,ln])=>labels.appendChild(el('text',{x:X(ln),y:Y(la),'font-size':12,'font-weight':900,'letter-spacing':2,fill:'var(--muted)','text-anchor':'middle',opacity:.85},t)));
 svg.appendChild(labels);
 window.paint=()=>{layer.innerHTML='';P.forEach((p,i)=>{
  if(p.off||off.has(p.s))return;
  const g=el('g',{class:'mk',tabindex:0,role:'button','aria-label':p.n,'data-i':i});
  const x=X(p.lng),y=Y(p.lat);
  if(p.s==='stn'){g.appendChild(el('rect',{x:x-6,y:y-6,width:12,height:12,fill:'var(--panel)',stroke:'var(--muted)','stroke-width':2.5}));
    g.appendChild(el('text',{x:x+10,y:y+4,'font-size':11,'font-weight':700,fill:'var(--muted)'},p.code.split(' ')[0]==='JR'?p.n:p.code.split(' ')[0]));}
  else if(p.s==='venue'){g.appendChild(el('circle',{cx:x,cy:y,r:11,fill:'var(--ink)',stroke:'var(--panel)','stroke-width':3}));
    g.appendChild(el('text',{x:x,y:y-16,'font-size':13,'font-weight':900,fill:'var(--ink)','text-anchor':'middle'},'PACIFICO NORTH'));}
  else g.appendChild(el('circle',{cx:x,cy:y,r:6.5,fill:CAT[p.s].k,stroke:'var(--panel)','stroke-width':2}));
  g.addEventListener('click',()=>showPin(i));
  g.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();showPin(i);}});
  layer.appendChild(g);});};
 paint();
 const lg=$('#legend');
 Object.entries(CAT).forEach(([k,v])=>{const b=document.createElement('button');b.className='lg';b.setAttribute('aria-pressed','true');
  b.innerHTML='<i class="'+(v.sq?'sq':'')+'" style="--k:'+v.k+'"></i>'+v.l;
  b.addEventListener('click',()=>{off.has(k)?off.delete(k):off.add(k);b.setAttribute('aria-pressed',String(!off.has(k)));paint();});lg.appendChild(b);});
}
function showPin(i){
 const p=P[i];
 $('#mapinfo').innerHTML='<div class="nm">'+p.n+(p.jp?' <span style="font-weight:700;font-size:13px;color:var(--muted)">'+p.jp+'</span>':'')+'</div>'
  +'<div class="meta">'+(p.code||p.h)+(p.o?' · '+p.o:'')+'</div><p style="margin:0 0 6px">'+p.d+'</p>'
  +(p.s!=='stn'?'<a href="'+gmap(p)+'" target="_blank" rel="noopener">Open in Google Maps</a>':'');
 document.querySelectorAll('#svgmap .mk').forEach(m=>m.style.opacity=(+m.dataset.i===i?1:''));
}

go(location.hash.slice(1)||'overview');
